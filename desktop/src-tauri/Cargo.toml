[package]
name = "codex-launch-deck"
version = "2.3.1"
description = "Launch Codex through a local proxy and apply CodeDrobe themes."
authors = ["GeoD"]
license = "MIT"
repository = "https://github.com/gaopengbin/codex-launch-deck"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "codex_launch_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "time"] }
encoding_rs = "0.8"
tauri-plugin-dialog = "2"
base64 = "0.22"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tungstenite = "0.24"
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
