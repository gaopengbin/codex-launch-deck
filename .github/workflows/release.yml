name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop installers
        working-directory: desktop
        run: npm run tauri build

      - name: Build legacy lightweight executable
        shell: powershell
        run: .\build.ps1

      - name: Package legacy portable build
        shell: powershell
        run: |
          Copy-Item README.md output\README.md
          Copy-Item README.zh-CN.md output\README.zh-CN.md
          Copy-Item LICENSE output\LICENSE
          Copy-Item Create-Desktop-Shortcut.ps1 output\Create-Desktop-Shortcut.ps1
          Compress-Archive -Path output\ChatGPTProxyLauncher.exe,output\Create-Desktop-Shortcut.ps1,output\README.md,output\README.zh-CN.md,output\LICENSE,output\themes -DestinationPath output\ChatGPTProxyLauncher-Legacy-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Proxy-Launch-Deck-win-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            output/ChatGPTProxyLauncher.exe
            output/ChatGPTProxyLauncher-Legacy-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            output/ChatGPTProxyLauncher.exe
            output/ChatGPTProxyLauncher-Legacy-win-x64.zip
          generate_release_notes: true
