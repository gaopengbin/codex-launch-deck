name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop installers
        working-directory: desktop
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build legacy lightweight executable
        shell: powershell
        run: .\build.ps1

      - name: Package legacy portable build
        shell: powershell
        run: |
          Copy-Item README.md output\README.md
          Copy-Item README.zh-CN.md output\README.zh-CN.md
          Copy-Item LICENSE output\LICENSE
          Copy-Item Create-Desktop-Shortcut.ps1 output\Create-Desktop-Shortcut.ps1
          Compress-Archive -Path output\ChatGPTProxyLauncher.exe,output\PackagedChatGPTLauncher.exe,output\Create-Desktop-Shortcut.ps1,output\README.md,output\README.zh-CN.md,output\LICENSE,output\themes -DestinationPath output\ChatGPTProxyLauncher-Legacy-win-x64.zip

      - name: Build updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $bundleRoot = "desktop/src-tauri/target/release/bundle"
          $signatureFile = Get-ChildItem $bundleRoot -Recurse -Filter "*.sig" |
            Where-Object { $_.FullName -match "\\nsis\\" } |
            Select-Object -First 1
          if (-not $signatureFile) {
            throw "No signed NSIS updater artifact was produced."
          }

          $payloadPath = $signatureFile.FullName.Substring(0, $signatureFile.FullName.Length - 4)
          $payload = Get-Item -LiteralPath $payloadPath
          $assetName = $payload.Name -replace ' ', '.'
          if ($assetName -ne $payload.Name) {
            $safePayloadPath = Join-Path $payload.DirectoryName $assetName
            Move-Item -LiteralPath $payload.FullName -Destination $safePayloadPath
            Move-Item -LiteralPath $signatureFile.FullName -Destination "$safePayloadPath.sig"
            $payload = Get-Item -LiteralPath $safePayloadPath
            $signatureFile = Get-Item -LiteralPath "$safePayloadPath.sig"
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$($env:GITHUB_REF_NAME)/$assetName"
          $manifest = [ordered]@{
            version = $version
            notes = "Launch Deck $version is available. See the GitHub release notes for details."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content -LiteralPath $signatureFile.FullName -Raw).Trim()
                url = $downloadUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "$bundleRoot/latest.json" -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Proxy-Launch-Deck-win-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.zip
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.zip
            desktop/src-tauri/target/release/bundle/msi/*.sig
            desktop/src-tauri/target/release/bundle/latest.json
            output/ChatGPTProxyLauncher-Legacy-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.zip
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.zip
            desktop/src-tauri/target/release/bundle/msi/*.sig
            desktop/src-tauri/target/release/bundle/latest.json
            output/ChatGPTProxyLauncher-Legacy-win-x64.zip
          generate_release_notes: true
