<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Proxy Launch Deck</title>
  <desc id="desc">A desktop launch deck for Codex proxy routing, CodeDrobe themes, and local AI theme creation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d18"/>
      <stop offset="0.58" stop-color="#0b2c25"/>
      <stop offset="1" stop-color="#061411"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="35%" r="65%">
